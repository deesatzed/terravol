[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "volterra-research"
version = "0.0.0"
description = "Project scaffold for auditable event-conditioned volatility research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
volterra = "volterra.__main__:main"

[dependency-groups]
dev = ["jsonschema==4.25.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/volterra"]
